<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">How gitsync works</title>
<desc id="d">The git server sends webhooks to the listener and is polled for its repository listing. Both feed a queue with one job per repository. Workers take jobs, fetch from the git server into a bare mirror, push to GitHub and apply settings through the GitHub API. State is kept in state.json.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
.hot{fill:#f0fdfa;stroke:#0f766e;stroke-width:1.8}
.t{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
.s{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}
.l{font:400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#334155}
.line{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style>
</defs>
<rect x="20" y="168" width="190" height="124" rx="12" class="box"/>
<text x="115.0" y="208" class="t">Git server</text>
<text x="115.0" y="230" class="s">Forgejo, Gitea, GitLab,</text>
<text x="115.0" y="248" class="s">Gogs, GitBucket, OneDev,</text>
<text x="115.0" y="264" class="s">Bitbucket</text>
<rect x="290" y="64" width="196" height="84" rx="12" class="box"/>
<text x="388.0" y="102" class="t">Webhook listener</text>
<text x="388.0" y="124" class="s">signed events only</text>
<rect x="290" y="312" width="196" height="84" rx="12" class="box"/>
<text x="388.0" y="350" class="t">Poller</text>
<text x="388.0" y="372" class="s">lists repos every 5 s</text>
<rect x="566" y="188" width="160" height="84" rx="12" class="hot"/>
<text x="646.0" y="226" class="t">Queue</text>
<text x="646.0" y="248" class="s">one job per repo</text>
<rect x="806" y="188" width="170" height="84" rx="12" class="hot"/>
<text x="891.0" y="226" class="t">Workers</text>
<text x="891.0" y="248" class="s">sync.workers, default 2</text>
<rect x="806" y="340" width="170" height="70" rx="12" class="box"/>
<text x="891.0" y="370" class="t">state.json</text>
<text x="891.0" y="392" class="s">and bare mirrors</text>
<rect x="1056" y="168" width="124" height="124" rx="12" class="box"/>
<text x="1118.0" y="217" class="t">GitHub</text>
<text x="1118.0" y="239" class="s">repos and</text>
<text x="1118.0" y="256" class="s">settings</text>
<path d="M210 206 C250 206 250 106 286 106" class="line"/>
<text x="242" y="146" class="l" text-anchor="end">webhook</text>
<path d="M210 256 C250 256 250 354 286 354" class="line"/>
<text x="242" y="324" class="l" text-anchor="end">listing</text>
<path d="M486 106 C530 106 520 214 562 214" class="line"/>
<path d="M486 354 C530 354 520 248 562 248" class="line"/>
<path d="M726 230 H802" class="line"/>
<path d="M976 214 H1052" class="line"/>
<text x="1014" y="204" class="l" text-anchor="middle">git push</text>
<path d="M976 248 H1052" class="line"/>
<text x="1014" y="270" class="l" text-anchor="middle">REST API</text>
<path d="M891 272 V336" class="line"/>
<path d="M115 168 V36 H891 V184" class="line"/>
<text x="503" y="26" class="l" text-anchor="middle">git fetch into a bare mirror</text>
</svg>
