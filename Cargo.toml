[package]
name = "gitsync"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Mirror repositories from a self-hosted git server to GitHub"
repository = "https://github.com/cristobaltormo/git-sync"
publish = false

[features]
default = ["bundled-roots"]
bundled-roots = ["ureq/rustls-webpki-roots"]

[[bin]]
name = "gitsync"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Time"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rustls-native-certs = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
